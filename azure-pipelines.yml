trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  buildConfiguration: 'Release'

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET SDK 10.x'
    inputs:
      packageType: 'sdk'
      useGlobalJson: true
      performMultiLevelLookup: true

  - script: |
      dotnet --info
      dotnet --list-sdks
    displayName: 'Verify SDK'

  - script: dotnet restore Fonbec.Web.sln
    displayName: 'Restore NuGet packages'

  - script: dotnet build Fonbec.Web.sln --configuration $(buildConfiguration) --no-restore
    displayName: 'Build project'

  - script: >
      dotnet test
      --solution Fonbec.Web.sln
      --configuration $(buildConfiguration)
      --no-build
      --report-trx
      --collect:"XPlat Code Coverage"
    displayName: 'Run unit tests'

  # Publish test results to Azure DevOps
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '**/*.trx'
      failTaskOnFailedTests: true

  # Publish coverage to Azure DevOps
  - task: PublishCodeCoverageResults@2
    inputs:
      codeCoverageTool: 'Cobertura'
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.cobertura.xml'
      failIfCoverageEmpty: true